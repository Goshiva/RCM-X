<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Medical Coding Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card">
            <p class="login-kicker">Medical Coding Workspace</p>
            <h1>Sign in</h1>
            <p class="login-subtitle">Access charts, diagnosis evidence, and coding review.</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input id="login-username" type="text" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input id="login-password" type="password" autocomplete="current-password" required>
                </div>
                <button class="btn-primary login-submit" type="submit">Sign in</button>
                <p id="login-feedback" class="feedback muted" role="status"></p>
            </form>
            <p class="login-help">Need access? Ask your supervisor, manager, or administrator to create your account.</p>
        </section>
    </main>
    <script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
